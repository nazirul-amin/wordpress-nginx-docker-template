services:
  db:
    image: mysql:8.0
    container_name: wordpress-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.5-fpm
    container_name: wordpress-php
    depends_on:
      - db
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - wordpress_core:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro

  nginx:
    image: nginx:stable-alpine
    container_name: wordpress-nginx
    depends_on:
      - wordpress
    restart: unless-stopped
    ports:
      - "${WORDPRESS_PORT}:80"
    volumes:
      - wordpress_core:/var/www/html:ro
      - ./wp-content:/var/www/html/wp-content:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data:
  wordpress_core:
